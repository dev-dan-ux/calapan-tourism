<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Login - Calapan Tourism</title>
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
  <link href="https://fonts.googleapis.com" rel="preconnect"><link href="https://fonts.gstatic.com" rel="preconnect" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">
  <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <script src="assets/js/app.js"></script>
  
  <style>
        body {
            background: linear-gradient(135deg, #ab3000ff 0%, #981d05ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            max-width: 500px;
            width: 100%;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }
        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ab3000ff 0%, #981d05ff 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .login-icon i {
            font-size: 40px;
            color: white;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h3 {
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #ab3000ff 0%, #981d05ff 100%);
            border: none;
            color: white;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.3s;
        }
        .btn-login:hover {
            opacity: 0.9;
            color: white;
        }
        .main-title {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .main-title h1 {
            font-weight: 700;
            margin-bottom: 10px;
        }
        .login-type-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .login-type-selector label {
            margin: 0;
            cursor: pointer;
        }
        .login-type-selector input[type="radio"] {
            display: none;
        }
        .login-type-selector input[type="radio"] + span {
            padding: 10px 20px;
            border-radius: 20px;
            background: #f8f9fa;
            color: #333;
            transition: all 0.3s;
            display: inline-block;
        }
        .login-type-selector input[type="radio"]:checked + span {
            background: linear-gradient(135deg, #ab3000ff 0%, #981d05ff 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="main-title">
            <h1>Calapan Tourism Portal</h1>
            <p>Sign in to book your trip</p>
        </div>
        <div class="login-card">
            <div class="login-icon"><i class="bi bi-person-circle"></i></div>
            <div class="login-header">
                <h3>Login</h3>
                <p class="text-muted">Enter your email and password</p>
            </div>
            <div id="msg" class="alert alert-danger d-none"></div>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-login"><i class="bi bi-box-arrow-in-right"></i> Login</button>
            </form>
            <div class="text-center mt-3">
                <p class="mb-0">Don't have an account? <a href="register.html">Sign up</a></p>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="index.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </div>
    </div>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var r = CT.login(document.getElementById("email").value, document.getElementById("password").value);
            if (!r.ok) {
                var m = document.getElementById("msg"); m.textContent = r.msg; m.classList.remove("d-none"); return;
            }
            location.href = (function (u) { return u && /^[a-z0-9\-_]+\.html(\?[a-z0-9=&\-_]*)?$/i.test(u) ? u : "index.html"; })(CT.param("redirect"));
        });
    </script>
</body>
</html>
